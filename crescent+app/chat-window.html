<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Chat</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="chat-window-container">
        <div class="chat-window-header">
            <button class="back-btn" onclick="window.location.href='chat.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div id="chatPartnerName" style="font-weight:700; color:#2c3e50; flex:1; text-align:center; font-size:16px;">User</div>
            <div style="width:40px;"></div>
        </div>

        <!-- ✅ স্পিনার সরানো – JS স্কেলেটন বসাবে -->
        <div id="messageList" class="message-list"></div>

        <!-- টাইপিং ইন্ডিকেটর -->
        <div id="typingIndicator" class="typing-indicator-wrapper" style="display:none; padding:4px 12px;">
            <span style="font-size:14px; color:#888; display:flex; align-items:center; gap:6px;">
                <span id="typingUserName">Someone</span> is typing
                <span class="typing-dots">
                    <span></span><span></span><span></span>
                </span>
            </span>
        </div>

        <!-- ইনপুট এলাকা -->
        <div class="message-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." />
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat-window.js"></script>
    <script src="js/scale.js"></script>
</body>
</html>
