<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Login</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-brand">
            <img src="assets/Crescentlogo.png" alt="Crescent+" width="50" height="50" style="border-radius: 50%;" />
            <span class="brand-text">Crescent<span class="plus">+</span></span>
        </div>

        <div class="login-header">
            <h1 class="login-title">Welcome</h1>
            <p class="login-subtitle">Login your Account</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="loginIdentifier">Email Address</label>
                <input type="email" id="loginIdentifier" placeholder="example@gmail.com" required />
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your password" required />
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember" />
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password" onclick="resetPassword()">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="create-account">
            Don't have an account? <a href="account.html">Create Account</a>
        </p>

        <div class="divider"><span>or</span></div>

        <div class="social-login">
            <button class="social-btn google-btn"><i class="fab fa-google"></i> Login with Google</button>
            <button class="social-btn facebook-btn" onclick="alert('Facebook login coming soon!')"><i class="fab fa-facebook-f"></i> Login with Facebook</button>
            <button class="social-btn email-btn" onclick="document.getElementById('loginForm').requestSubmit();"><i class="fas fa-envelope"></i> Login with Email</button>
        </div>

        <!-- Resend Verification -->
        <div style="text-align:center; margin-top:15px;">
            <button onclick="resendVerification()" style="background:none; border:none; color:#2c3e50; text-decoration:underline; cursor:pointer; font-size:14px;">
                Didn't get the verification email? Resend
            </button>
        </div>

        <!-- ✅ NEW: টেক্সট + Support বাটন একই লাইনে -->
        <div style="text-align:center; margin-top:16px; padding-top:12px; border-top:1px solid #eee; font-size:14px; color:#555;">
            If you face any issue, feel free to take
            <a href="support.html" style="
                display:inline-block;
                background: #2c3e50;
                color: white;
                padding: 4px 18px;
                border-radius: 30px;
                font-size: 13px;
                font-weight: 600;
                text-decoration: none;
                transition: 0.3s;
                cursor: pointer;
                margin-left: 4px;
                border: none;
            " onmouseover="this.style.background='#1a252f'; this.style.transform='scale(1.05)';" 
               onmouseout="this.style.background='#2c3e50'; this.style.transform='scale(1)';">
                <i class="fas fa-headset"></i> support
            </a>
        </div>
    </div>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/scale.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
