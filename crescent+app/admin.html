<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Admin Panel</title>
    
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-container">
        <!-- Loading (hidden by default, JS will hide it) -->
        <div id="adminLoading" style="display:none; flex-direction:column; align-items:center; justify-content:center; min-height:70vh;">
            <!-- spinner removed -->
        </div>

        <!-- Main Content -->
        <div id="adminContent" style="display:block;">
            <!-- Header with Logo & Brand -->
            <div class="admin-header">
                <div class="admin-brand">
                    <img src="assets/Crescentlogo.png" alt="Crescent+" />
                    <span class="brand-text">Crescent<span class="plus">+</span></span>
                    <span class="admin-badge">Admin</span>
                </div>
                <button class="admin-back-btn" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Stats -->
            <div class="admin-stats">
                <div class="stat-box">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">Total Users</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalDoctors">0</div>
                    <div class="label">Doctors</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="totalDonors">0</div>
                    <div class="label">Donors</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="active" onclick="switchTab('all')" id="tabAll">
                    <i class="fas fa-users"></i> All Users
                </button>
                <button onclick="switchTab('doctors')" id="tabDoctors">
                    <i class="fas fa-user-md"></i> Doctors
                </button>
                <button onclick="switchTab('donors')" id="tabDonors">
                    <i class="fas fa-tint"></i> Donors
                </button>
                <!-- Support Tickets Tab -->
                <button onclick="window.location.href='admin-support.html'" id="tabSupport" style="background:#8e44ad; color:white;">
                    <i class="fas fa-ticket-alt"></i> Support
                </button>
            </div>

            <!-- List Container – JS will inject skeleton cards here -->
            <div id="adminListContainer" class="admin-list">
                <!-- Skeleton cards will be injected by admin.js -->
            </div>

            <!-- Pagination Container -->
            <div id="paginationContainer" style="margin-top:16px;"></div>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/scale.js"></script>
</body>
</html>
