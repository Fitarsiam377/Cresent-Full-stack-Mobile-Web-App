<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Blood Request</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="request-container">

        <!-- Header -->
        <div class="request-header">
            <button class="back-btn" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2>Blood Request</h2>
            <div style="width:40px;"></div>
        </div>

        <!-- ===== CREATE REQUEST FORM ===== -->
        <div class="request-form-section">
            <h3 class="section-title"><i class="fas fa-plus-circle"></i> New Request</h3>
            <form id="requestForm">
                <div class="form-group">
                    <label>Patient Name <span class="required">*</span></label>
                    <input type="text" id="patientName" placeholder="Enter patient name" required />
                </div>

                <div class="form-group">
                    <label>Patient Age <span class="required">*</span></label>
                    <input type="number" id="patientAge" placeholder="e.g., 35" min="0" max="120" required />
                </div>

                <div class="form-group">
                    <label>Disease / Condition (optional)</label>
                    <input type="text" id="disease" placeholder="e.g., Thalassemia, Accident, etc." />
                </div>

                <div class="form-group">
                    <label>Blood Group <span class="required">*</span></label>
                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Hospital Address <span class="required">*</span></label>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="hospitalAddress" placeholder="Start typing hospital name or address..." required autocomplete="off" />
                        <div id="suggestions-box" class="suggestions-box"></div>
                    </div>
                    <small class="hint">Type to search location (powered by OpenStreetMap).</small>
                </div>

                <div class="form-group">
                    <label>Units Needed</label>
                    <input type="number" id="units" value="1" min="1" max="10" />
                </div>

                <div class="form-group">
                    <label>Priority <span class="required">*</span></label>
                    <div class="priority-toggle">
                        <button type="button" class="priority-btn critical" data-value="Critical">🔴 Critical</button>
                        <button type="button" class="priority-btn medium" data-value="Medium">🟡 Medium</button>
                        <button type="button" class="priority-btn normal active" data-value="Normal">🟢 Normal</button>
                    </div>
                    <input type="hidden" id="priority" value="Normal" />
                    <small class="hint">Critical: 1-2 hrs • Medium: 24 hrs • Normal: 2-3 days</small>
                </div>

                <div class="form-group">
                    <label>Additional Note</label>
                    <textarea id="note" rows="5" placeholder="Any extra details... (optional)" class="large-textarea"></textarea>
                </div>

                <button type="submit" class="submit-request-btn">
                    <i class="fas fa-paper-plane"></i> Submit Request
                </button>
                <button type="button" class="cancel-request-btn" onclick="resetForm()" style="display:none;" id="cancelEditBtn">
                    <i class="fas fa-times"></i> Cancel Edit
                </button>
            </form>
        </div>

        <!-- ===== MY REQUESTS LIST ===== -->
        <div class="my-requests-section">
            <h3 class="section-title"><i class="fas fa-list-ul"></i> My Requests</h3>
            <div id="requestList" class="request-list">
                <!-- JS will inject skeleton cards -->
            </div>
        </div>

        <!-- ===== SEARCH DONORS ===== -->
        <div class="search-donor-section">
            <h3 class="section-title"><i class="fas fa-search-location"></i> Find Donors</h3>
            <button class="search-donor-btn" onclick="searchDonorsForRequest()">
                <i class="fas fa-search"></i> Search Donors
            </button>
            <div id="donorSearchResults" class="donor-search-results">
                <!-- results will appear here -->
            </div>
        </div>

    </div>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/request.js"></script>
    <script defer src="js/scale.js"></script>
</body>
</html>
