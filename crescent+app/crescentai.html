<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Crescent AI</title>
        <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
     
    <div class="crescent-container">

        <!-- Header – now using .jpeg and border-radius:50% -->
        <div class="crescent-header">
            <div class="crescent-brand">
                <img src="assets/Crescentlogo.jpeg" alt="Crescent+" style="border-radius:50%;" />
                <span class="brand-text">Crescent <span class="plus">+</span></span>
                <span class="ai-badge">AI</span>
            </div>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
          
            <div class="message ai-message">
                <div class="avatar ai-avatar" style="background:#2c3e50; overflow:hidden; border:2px solid #2c3e50; border-radius:50%;">
                    <img src="assets/Crescentlogo.jpeg" alt="Crescent AI" style="width:100%; height:100%; object-fit:contain; padding:3px; border-radius:50%;" />
                </div>
                <div class="bubble">
                    <p>
                        Hello! I'm <strong>Crescent AI</strong>, your blood donation companion.<br />
                        Developed by <strong>Al Fitar Ahmed</strong>.<br />
                        How can I help you today?
                    </p>
                    <span class="timestamp">Just now</span>
                </div>
            </div>
        </div>

        <!-- Suggestion Chips -->
        <div class="suggestion-chips" id="suggestionChips">
            <button onclick="sendQuickMessage('Find donors in my area')">📍 Find donors</button>
            <button onclick="sendQuickMessage('Check my eligibility to donate')">🩸 Check eligibility</button>
            <button onclick="sendQuickMessage('Nearby blood banks')">🏥 Nearby banks</button>
            <button onclick="sendQuickMessage('Emergency request')">🚨 Emergency</button>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask Crescent AI..." />
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/ai.js"></script>
    <script defer src="js/scale.js"></script>
</body>
</html>
