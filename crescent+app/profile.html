<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Profile</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="profile-container">

        <!-- Header – Centered Heading -->
        <div class="profile-header" style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; width:100%; margin-bottom:25px; padding-bottom:15px; border-bottom:2px solid #eee;">

            <!-- Left: Back + Delete -->
            <div style="display:flex; align-items:center; gap:8px; justify-content:flex-start;">
                <button class="back-btn" onclick="window.location.href='dashboard.html'" style="background:none; border:none; font-size:22px; color:#2c3e50; cursor:pointer; padding:5px 10px; border-radius:30px; transition:0.3s;">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button class="delete-account-btn" onclick="deleteAccount()" title="Delete Account" style="background:#e74c3c; color:white; border:none; padding:6px 12px; border-radius:30px; font-size:16px; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:4px;">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>

            <!-- Center: Heading -->
            <h2 style="text-align:center; margin:0; font-size:20px; font-weight:700; color:#2c3e50;">Edit Profile</h2>

            <!-- Right: Logout -->
            <div style="display:flex; align-items:center; gap:10px; justify-content:flex-end;">
                <button class="logout-btn" onclick="logout()" style="background:#e74c3c; color:white; border:none; padding:8px 18px; border-radius:30px; font-size:14px; font-weight:600; cursor:pointer; transition:0.3s; display:flex; align-items:center; gap:6px;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <!-- Profile Form -->
        <form class="profile-form" id="profileForm">

            <!-- Profile Picture -->
            <div class="profile-pic-section">
                <div class="profile-pic-wrapper">
                    <img id="profileImage" src="assets/default-avatar.png" alt="Profile" />
                    <label for="profilePicInput" class="edit-pic-btn">
                        <i class="fas fa-camera"></i>
                    </label>
                    <input type="file" id="profilePicInput" accept="image/*" style="display:none;" />
                </div>
                <small class="hint">Click camera icon to change photo</small>
            </div>

            <!-- Name -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="profileName" placeholder="Your name" required />
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="profilePhone" placeholder="01XXXXXXXXX" required />
            </div>

            <!-- Email (read-only) -->
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="profileEmail" placeholder="Email" disabled />
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label>Blood Group</label>
                <select id="profileBloodGroup">
                    <option value="">Select</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="profileAge" placeholder="18" min="18" max="65" />
            </div>

            <!-- City -->
            <div class="form-group">
                <label>City</label>
                <input type="text" id="profileCity" placeholder="Dhaka, Chittagong..." />
            </div>

            <!-- Area -->
            <div class="form-group">
                <label>Area</label>
                <input type="text" id="profileArea" placeholder="Gulshan, Banani..." />
            </div>

            <!-- Become a Donor Toggle -->
            <div class="form-group">
                <label>Become a Donor?</label>
                <div class="donor-toggle">
                    <label class="toggle-option">
                        <input type="radio" name="profileDonor" value="yes" /> Yes
                    </label>
                    <label class="toggle-option">
                        <input type="radio" name="profileDonor" value="no" /> No
                    </label>
                </div>
            </div>

            <!-- Last Donation Date -->
            <div class="form-group">
                <label>Last Blood Donation Date</label>
                <input type="date" id="profileLastDonation" />
                <small class="hint">Leave empty if you haven't donated before</small>
            </div>

            <!-- Buttons -->
            <div class="profile-actions">
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <button type="button" class="cancel-btn" onclick="window.location.href='dashboard.html'">
                    Cancel
                </button>
            </div>
        </form>

        <!-- ✅ ডাক্তার ডিলিট বাটন – শুধু ডাক্তার দেখতে পাবেন -->
        <div id="doctorDeleteSection" style="display:none; margin-top: 20px; text-align: center; padding: 12px 0; border-top: 1px solid #eee;">
            <button onclick="deleteDoctorProfile()" style="background: #e67e22; color: white; border: none; padding: 12px 24px; border-radius: 30px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.25);">
                <i class="fas fa-user-md"></i> Delete Doctor Profile
            </button>
            <small style="display: block; color: #999; font-size: 12px; margin-top: 6px;">This will remove you from the doctor list. Your account will remain active.</small>
        </div>

    </div>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/profile.js"></script>
    <script defer src="js/scale.js"></script>
</body>
</html>
