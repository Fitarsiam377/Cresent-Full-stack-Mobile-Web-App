<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Dashboard</title>
    <meta name="theme-color" content="#2c3e50" />
    <link rel="manifest" href="manifest.json" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crescent+" />
    <link rel="apple-touch-icon" href="assets/Crescentlogo.png" />

    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    </noscript>

    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="dashboard-container">

        <!-- ===== HEADER ===== -->
        <div class="dashboard-header">
            <div class="dashboard-brand">
                <img src="assets/Crescentlogo.png" alt="Crescent+" />
                <span class="brand-text">Crescent<span class="plus">+</span></span>
            </div>
            <div class="header-right">
                <span id="userName">User</span>
                <div style="position:relative; display:inline-block; cursor:pointer;" onclick="toggleNotificationDropdown()">
                    <i class="fas fa-bell" style="font-size:22px; color:#2c3e50;"></i>
                    <span id="notificationBadge" style="
                        position:absolute; top:-6px; right:-8px; background:#e74c3c; color:white;
                        font-size:11px; font-weight:bold; border-radius:50%; padding:2px 6px;
                        display:none; min-width:18px; text-align:center; line-height:1.4;
                    ">0</span>
                </div>
                <div id="notificationDropdown" style="
                    display:none; position:absolute; right:0; top:50px; background:white;
                    width:320px; max-height:400px; overflow-y:auto; border-radius:12px;
                    box-shadow:0 10px 40px rgba(0,0,0,0.15); z-index:999; padding:8px 0;
                    border:1px solid #eee;
                ">
                    <div style="padding:10px 16px; font-weight:700; border-bottom:1px solid #eee; color:#2c3e50;">
                        Notifications
                    </div>
                    <div id="notificationList" style="padding:0;">
                        <div style="padding:16px; text-align:center; color:#999;">No notifications</div>
                    </div>
                </div>

                <div class="dashboard-profile-icon" onclick="window.location.href='profile.html'" style="overflow:hidden; background:#2c3e50; border:2px solid #2c3e50; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                    <img id="profileIconImg" src="assets/Crescentlogo.png" alt="Profile" style="width:100%; height:100%; object-fit:cover; padding:0; border-radius:50%;" />
                </div>
            </div>
        </div>

        <!-- ===== DASHBOARD BUTTONS GRID ===== -->
        <div class="dashboard-buttons-grid">
            <div class="see-donors-section">
                <button id="toggleDonorsBtn" class="see-donors-btn" onclick="toggleDonorList()" style="background: linear-gradient(135deg, #27ae60, #1e8449); color:white; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);">
                    <i class="fas fa-users"></i> See our community
                </button>
            </div>
            <div class="see-donors-section">
                <button class="see-donors-btn" onclick="window.location.href='crescentcare.html'" style="background: linear-gradient(135deg, #3498db, #2980b9); color:white; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);">
                    <i class="fas fa-user-md"></i> Find Doctors
                </button>
            </div>
            <div class="see-donors-section">
                <button class="see-donors-btn" onclick="window.location.href='chat.html'" style="background: #f1c40f; color: #2c3e50; box-shadow: 0 4px 15px rgba(241, 196, 15, 0.4);">
                    <i class="fas fa-comment-dots"></i> Crescent Chat
                </button>
            </div>
            <div class="see-donors-section">
                <button class="see-donors-btn" onclick="window.location.href='request.html'" style="background: linear-gradient(135deg, #c0392b, #a93226); color:white; box-shadow: 0 4px 15px rgba(192, 57, 43, 0.3);">
                    <i class="fas fa-tint"></i> Need Blood? Request Now
                </button>
            </div>
        </div>

        <!-- ===== ADMIN PANEL ===== -->
        <div id="adminPanelBtn" class="admin-panel-full">
            <button class="see-donors-btn" onclick="window.location.href='admin.html'">
                <i class="fas fa-shield-alt"></i> Admin Panel
            </button>
        </div>

        <!-- ===== DONOR GRID (with Location Search) ===== -->
        <div id="donorGridContainer" style="display:none;">
            
            <!-- ===== SEARCH BAR ROW — Heading + Location Input + Blood Group ===== -->
            <div style="
                display:flex; align-items:center; gap:6px;
                padding:8px 0 12px 0; flex-wrap:nowrap;
            ">
                
                <!-- Heading — সব device-এ same text -->
                <span style="
                    font-weight:700; color:#2c3e50; font-size:14px;
                    display:flex; align-items:center; gap:4px;
                    white-space:nowrap; flex-shrink:0;
                ">
                    <i class="fas fa-hand-holding-heart" style="color:#c0392b; font-size:13px;"></i>
                    <span>Available Donors</span>
                </span>

                <!-- Location Search (flex-grow) -->
                <div style="flex:1; position:relative; min-width:0;">
                    <i class="fas fa-map-marker-alt" style="
                        position:absolute; left:11px; top:50%; transform:translateY(-50%);
                        color:#888; font-size:12px; pointer-events:none;
                    "></i>
                    <input 
                        type="text" 
                        id="locationFilter" 
                        placeholder="Search area..." 
                        style="
                            width:100%; padding:8px 28px 8px 30px;
                            border:1.5px solid #e8edf2; border-radius:30px;
                            font-size:13px; background:#fafbfc; color:#2c3e50;
                            transition:0.2s; outline:none;
                            box-sizing:border-box;
                        "
                        onfocus="this.style.borderColor='#3498db'; this.style.background='white';"
                        onblur="this.style.borderColor='#e8edf2'; this.style.background='#fafbfc';"
                    />
                    <button 
                        id="clearLocationBtn"
                        type="button"
                        onclick="clearLocationFilter()"
                        style="
                            position:absolute; right:7px; top:50%; transform:translateY(-50%);
                            background:none; border:none; color:#ccc; cursor:pointer;
                            font-size:13px; padding:2px; display:none;
                        "
                        title="Clear"
                    >
                        <i class="fas fa-times-circle"></i>
                    </button>
                </div>

                <!-- Blood Group Dropdown -->
                <select class="blood-group-dropdown" id="bloodGroupFilter" style="
                    flex-shrink:0; font-size:13px; padding:8px 10px;
                    border:1.5px solid #e8edf2; border-radius:30px;
                    background:#fafbfc; color:#2c3e50; font-weight:600;
                    cursor:pointer; outline:none;
                ">
                    <option value="">All</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>

            </div>

            <!-- Active Filter Indicator -->
            <div id="activeFilterInfo" style="
                display:none; font-size:12px; color:#555;
                background:#eef7ff; padding:6px 14px; border-radius:20px;
                border-left:3px solid #3498db;
                margin-bottom:10px;
            ">
                <i class="fas fa-filter"></i> Showing: <span id="filterText"></span>
            </div>

            <div class="donor-grid" id="donorGrid">
                <!-- JS will fill this with skeleton or actual donors -->
            </div>
        </div>

        <!-- ===== CRESCENT AI ===== -->
        <div class="ai-section">
            <div class="ai-title">
                <img src="assets/Crescentlogo.jpeg" alt="Crescent+" style="width:32px; height:32px; vertical-align:middle; margin-right:8px; border-radius:50%; object-fit:contain; background:#2c3e50; padding:4px;" />
                Find the donor faster with
            </div>
            <div class="ai-sub">Crescent AI — your intelligent blood companion</div>
            <button class="ai-btn" onclick="window.location.href='crescentai.html'">
                <i class="fas fa-arrow-right"></i> Crescent AI
            </button>
        </div>

        <!-- ===== MY REQUESTS ===== -->
        <div class="section-title" style="margin-top:20px;">
            <i class="fas fa-clipboard-list"></i> My Requests
        </div>
        <div id="myRequestsContainer" class="pending-requests-grid"></div>

        <!-- ===== PENDING REQUESTS (others) ===== -->
        <div class="section-title" style="margin-top:20px;">
            <i class="fas fa-exclamation-circle"></i> Pending Requests (Others)
        </div>
        <div id="pendingRequestsContainer" class="pending-requests-grid"></div>

        <!-- ===== MY HELP OFFERS ===== -->
        <div class="section-title" style="margin-top:20px;">
            <i class="fas fa-hand-holding-heart"></i> My Help Offers
        </div>
        <div id="myHelpOffersContainer" class="pending-requests-grid"></div>

        <!-- ===== MY DELIVERY REQUESTS ===== -->
        <div class="section-title" style="margin-top:20px;">
            <i class="fas fa-truck"></i> My Delivery Requests
        </div>
        <div id="myDeliveryRequestsContainer" class="pending-requests-grid"></div>

    </div>

    <!-- ===== MODALS ===== -->
    <div id="requestModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(12px); z-index:9999; justify-content:center; align-items:center; padding:20px;">
        <div style="background:linear-gradient(145deg, #ffffff, #f8f6f4); max-width:520px; width:100%; border-radius:32px; padding:0; position:relative; max-height:92vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.3);">
            <div id="modalContent"></div>
        </div>
    </div>

    <div id="deliveryModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter:blur(12px); z-index:10000; justify-content:center; align-items:center; padding:20px;">
        <div style="background:white; max-width:600px; width:100%; border-radius:28px; padding:20px; max-height:92vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,0.25);">
            <div id="deliveryModalContent"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/dashboard.js"></script>
    <script defer src="js/delivery.js"></script>
    <script defer src="js/notification.js"></script>
    <script defer src="js/scale.js"></script>
</body>
</html>
