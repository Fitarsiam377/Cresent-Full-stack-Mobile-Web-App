<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Admin Support</title>
    
    <link rel="stylesheet" href="css/support.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
    <div class="admin-support-container">
        <!-- Header -->
        <div class="admin-support-header">
            <button class="back-btn" onclick="window.location.href='admin.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2><i class="fas fa-ticket-alt" style="color:#3498db;"></i> Support Tickets</h2>
            <span id="ticketCount" class="ticket-count">0</span>
        </div>

        <!-- ✅ স্পিনার সরানো – JS স্কেলেটন বসাবে -->
        <div id="ticketList"></div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-support.js"></script>
    <script src="js/scale.js"></script>
</body>
</html>
