<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescent+ | Create Account</title>
        <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="register-container">
        <div class="register-brand">
            <img src="assets/Crescentlogo.png" alt="Crescent+" width="50" height="50" style="border-radius: 50%;" />
            <span class="brand-text">Crescent<span class="plus">+</span></span>
        </div>

        <div class="register-header">
            <h1 class="register-title">Create Account</h1>
            <p class="register-subtitle">For Saving Lives</p>
        </div>

        <form class="register-form" id="registerForm">
            <!-- Profile Picture -->
            <div class="form-group profile-pic-group">
                <label>Profile Picture</label>
                <div class="profile-pic-wrapper" onclick="document.getElementById('profilePic').click();">
                    <div id="profilePreview" class="profile-preview">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="camera-overlay">
                        <i class="fas fa-camera"></i>
                    </div>
                    <input type="file" id="profilePic" accept="image/*" style="display:none;" onchange="previewImage(event)" />
                </div>
                <small class="hint">Tap the circle to upload a profile picture (optional)</small>
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" placeholder="Enter your full name" required />
            </div>

            <!-- Mobile -->
            <div class="form-group">
                <label>Mobile Number <span class="required">*</span></label>
                <input type="tel" id="mobile" placeholder="01XXXXXXXXX" required />
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="example@gmail.com" required />
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Create a strong password (min 6 chars)" required />
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label>Blood Group <span class="required">*</span></label>
                    <select id="bloodGroup" required>
                        <option value="">Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label>Age <span class="required">*</span></label>
                    <input type="number" id="age" placeholder="18" min="18" max="65" required />
                </div>
            </div>

            <div class="form-group">
                <label>Location / City <span class="required">*</span></label>
                <input type="text" id="city" placeholder="e.g., Dhaka, Chittagong" required />
            </div>

            <div class="form-group">
                <label>Area <span class="required">*</span></label>
                <input type="text" id="area" placeholder="e.g., Gulshan, Banani" required />
            </div>

            <div class="form-group">
                <label>Share your location (Google Maps link)</label>
                <input type="url" id="mapLink" placeholder="https://maps.google.com/..." />
                <small class="hint">Optional: Paste your Google Maps location link</small>
            </div>

            <div class="form-group">
                <label>Become a Donor? <span class="required">*</span></label>
                <div class="donor-toggle">
                    <label class="toggle-option"><input type="radio" name="donor" value="yes" required /> Yes</label>
                    <label class="toggle-option"><input type="radio" name="donor" value="no" required /> No</label>
                </div>
            </div>

            <div class="form-group">
                <label>Last Blood Donation Date</label>
                <input type="date" id="lastDonation" />
                <small class="hint">If you have donated before, please select the date</small>
            </div>

            <button type="submit" class="register-btn">Create Account</button>
        </form>

        <p class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>

    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/auth.js"></script>
     <script defer src="js/scale.js"></script>
    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('profilePreview');
                    preview.innerHTML = `<img src="${e.target.result}" alt="Profile" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
